site_name: Dr. Sandeep | AI Automation & Clinical Expert
site_url: https://drsandeep.allhelp.in/
site_description: Healthcare AI, Ayurveda, automation, and clinical intelligence portfolio by Dr. Sandeep Shrivastva.

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - meta          
  - attr_list     
  - md_in_html    
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

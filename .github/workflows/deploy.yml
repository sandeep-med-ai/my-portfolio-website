name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          # Yahan se cache wali line hata di gayi hai taaki error na aaye

      - name: 📦 Install MkDocs Material & Plugins
        run: pip install mkdocs-material mkdocs-awesome-pages-plugin

      - name: 🧱 Build Site Strictly
        run: mkdocs build --strict

      # --- 🛡️ Dr. Sandeep's Bulletproof Link Scanner ---
      - name: 🔗 Scan for Broken Links (Lychee)
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --timeout 30
            --base './site'
            --exclude-path './site/404.html'
            --exclude 'https://drsandeep.allhelp.in/.*'
            --exclude 'https://fonts.gstatic.com/.*'
            --exclude 'https://github.com/user-attachments/assets/.*'
            --exclude 'https://www.linkedin.com/.*'
            './site/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
